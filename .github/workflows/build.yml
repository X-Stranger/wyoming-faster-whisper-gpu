name: Build Wyoming Faster Whisper GPU

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "OHF-Voice/wyoming-faster-whisper tag"
        required: true
        default: "v3.8.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Dockerfile.gpu produces a very large image (~10.7 GB).
      # GitHub's standard runner has only 14 GB SSD, so reclaim
      # as much preinstalled space as possible before building.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            || true

          docker system prune -af || true
          df -h

      - name: Fetch upstream source
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "${{ inputs.upstream_tag }}" \
            https://github.com/OHF-Voice/wyoming-faster-whisper.git \
            upstream

      - name: Pin PyAV below 19
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("upstream/pyproject.toml")
          text = path.read_text()

          dependency = '"av>=11,<19",'

          if dependency not in text:
              needle = '"faster-whisper>=1.2.1,<2",'

              if needle not in text:
                  raise SystemExit(
                      "Could not locate faster-whisper dependency in pyproject.toml"
                  )

              text = text.replace(
                  needle,
                  needle + "\n" + dependency,
                  1,
              )

              path.write_text(text)

          print("PyAV dependency:")
          for line in path.read_text().splitlines():
              if '"av' in line:
                  print(line)
          PY

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.upstream_tag }}"
          VERSION="${TAG#v}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="$(git -C upstream rev-parse HEAD)"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${OWNER}/wyoming-faster-whisper-gpu" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-gpu-r1
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}-r1
          labels: |
            org.opencontainers.image.title=Wyoming Faster Whisper GPU
            org.opencontainers.image.description=GPU build of OHF-Voice/wyoming-faster-whisper
            org.opencontainers.image.url=https://github.com/OHF-Voice/wyoming-faster-whisper
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
