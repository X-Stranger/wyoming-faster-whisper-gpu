name: Build Wyoming Faster Whisper GPU

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "OHF-Voice/wyoming-faster-whisper tag"
        required: true
        default: "v3.8.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Dockerfile.gpu produces a very large image (~10.7 GB).
      # GitHub's standard runner has only 14 GB SSD, so reclaim
      # as much preinstalled space as possible before building.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            || true

          docker system prune -af || true
          df -h

      - name: Fetch upstream source
        shell: bash
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          test "$UPSTREAM_TAG" = "v3.8.1" || { echo "Review/retest Jarvis before changing upstream" >&2; exit 1; }
          git clone \
            --depth 1 \
            --branch "$UPSTREAM_TAG" \
            https://github.com/OHF-Voice/wyoming-faster-whisper.git \
            upstream

      - name: Apply reviewed shared-model Jarvis extension
        shell: bash
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "8c9142ecfa8fdb5b3cea82ad1dcad71cc24ebab9"
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/jarvis-shared-encoder.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patches/jarvis-shared-encoder.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check shared-model extension without GPU or model downloads
        shell: bash
        run: |
          python -m pip install 'faster-whisper==1.2.1' 'ctranslate2==4.8.3' 'numpy==2.5.4' 'av>=11,<19' 'wyoming>=1.10.2,<2' 'pysilero-vad>=3.4,<4' aiohttp pytest==8.4.2 pytest-asyncio
          cd upstream
          # __init__ reads importlib.metadata; PYTHONPATH alone does not install metadata.
          # Keep the explicitly pinned CI dependencies unchanged.
          python -m pip install --no-deps -e .
          PYTHONPATH=. python -m pytest -q tests/test_jarvis_encoder.py tests/test_models.py tests/test_dispatch_handler.py tests/test_env_args.py tests/test_health_check.py

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.upstream_tag }}"
          VERSION="${TAG#v}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="$(git -C upstream rev-parse HEAD)"

          echo "tag=${VERSION}-gpu-jarvis-${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${OWNER}/wyoming-faster-whisper-gpu" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:jarvis-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Wyoming Faster Whisper GPU
            org.opencontainers.image.description=GPU build of OHF-Voice/wyoming-faster-whisper
            org.opencontainers.image.url=https://github.com/OHF-Voice/wyoming-faster-whisper
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            technology.bastion.upstream.revision=${{ steps.meta.outputs.sha }}

      - name: Record immutable image tags
        shell: bash
        run: |
          echo '### Shared-model Whisper image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.image }}:jarvis-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
